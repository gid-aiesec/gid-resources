name: Code Quality

on:
  pull_request:
    branches:
      - staging
      - main
  workflow_call: # lets another workflow (e.g. a combined ci.yml) run this as a job instead of its own trigger

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend # CONFIGURE: directory containing your package.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/* # CONFIGURE: pin an exact version if your project needs one
          cache: npm
          cache-dependency-path: Frontend/package-lock.json # CONFIGURE: match working-directory above

      - name: Install dependencies
        run: npm ci

      - name: Run lint, format, typecheck, and file-size checks
        run: npm run check:ci
